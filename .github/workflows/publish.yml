name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to release (must match the source)
        required: true
        default: '0.2.0'
        type: string
      publish:
        description: Upload the checked distributions to PyPI
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]' twine
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          from dmux import __version__
          assert os.environ['RELEASE_VERSION'] == __version__ == version('dmux-ml'), 'Release version mismatch'
          PY
      - run: pytest -q
      - run: ruff check .
      - run: mypy
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dmux-ml/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish checked distributions
        uses: pypa/gh-action-pypi-publish@release/v1
