name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tmux for private-socket integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python -m pip install -e '.[dev]'
      - name: Install optional MLflow SDK for file-format compatibility test
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m pip install '.[mlflow]' 'mlflow-skinny==3.3.2'
      - name: Install current supported MLflow SDK for demo compatibility
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m pip install --upgrade '.[mlflow]' 'sqlalchemy>=2,<3' 'alembic>=1.10,<2'
      - run: pytest -q
      - run: ruff check .
      - run: mypy
      - run: python -m build
      - name: Retain checked release candidates
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: dmux-ml-distributions
          path: dist/*
          retention-days: 14
