[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dmux"
version = "0.1.0"
description = "Terminal workspaces and monitoring for machine-learning experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Ignacio"}]
dependencies = [
  "psutil>=5.9",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dmux = "dmux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
